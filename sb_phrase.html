<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#1a1d21;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;-webkit-user-select:none}
  .box{padding:16px 18px;display:flex;flex-direction:column;height:100%;box-sizing:border-box;gap:8px}
  h3{margin:0;font-size:14px;font-weight:600}
  .hint{font-size:11px;color:#9aa4ac}
  input{background:#2c3136;border:1px solid #4a5157;border-radius:6px;color:#fff;padding:9px 12px;font-size:14px;outline:none;width:100%;box-sizing:border-box}
  input:focus{border-color:#36c5f0}
  #err{min-height:18px;font-size:12px;color:#f9a4a4}
  button{background:#007a5a;border:none;color:#fff;border-radius:6px;padding:8px 0;font-size:13px;cursor:pointer}
  button:hover{background:#0b8f6e}
  .current{font-size:11px;color:#8fa3b8;margin-top:2px}
</style>
</head>
<body>
<div class="box">
  <h3>Change Secret Phrase</h3>
  <div class="current" id="cur"></div>
  <input id="phrase" type="text" placeholder="new phrase" autofocus maxlength="80">
  <div id="err"></div>
  <button id="go">Save</button>
  <div class="hint">Type this phrase in your own DM to unlock the browser. Default: "enjoy you"</div>
</div>
<script>
  const { ipcRenderer } = require('electron');
  const cur = document.getElementById('cur');
  const input = document.getElementById('phrase');
  const err = document.getElementById('err');
  ipcRenderer.invoke('sb-phrase-get').then((v) => {
    if (v) cur.textContent = 'Current: ' + v;
  }).catch(() => {});
  async function submit() {
    const val = input.value.trim();
    if (!val) { err.textContent = 'Phrase cannot be empty'; return; }
    if (val.length < 3) { err.textContent = 'Minimum 3 characters'; return; }
    err.textContent = '';
    try {
      const r = await ipcRenderer.invoke('sb-phrase-set', val);
      if (r && r.ok) { window.close(); return; }
      err.textContent = (r && r.msg) || 'Failed to save';
    } catch (e) { err.textContent = 'Error'; }
  }
  document.getElementById('go').addEventListener('click', submit);
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });
  addEventListener('keydown', (ev) => { if (ev.key === 'Escape') window.close(); });
  input.focus();
</script>
</body>
</html>
